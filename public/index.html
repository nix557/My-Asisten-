<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AI Asisten" />
  <meta name="description" content="AI Asisten dengan Gemini" />
  <title>AI Asisten - Gemini</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="favicon.ico" />
  <style>
    /* Prevent body from scrolling */
    html, body {
      overflow: hidden;
      position: fixed;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      /* Prevent scrolling and bouncing */
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    
    /* Prevent text selection during interactions */
    * {
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    /* Allow text selection in message bubbles */
    .bubble-text {
      -webkit-user-select: text;
      user-select: text;
    }
    
    /* Improve scrolling performance */
    .messages-container {
      -webkit-overflow-scrolling: touch;
    }
    
    /* Fix for iOS Safari home screen */
    @supports (-webkit-touch-callout: none) {
      .messages-container {
        padding-bottom: env(safe-area-inset-bottom);
      }
      
      .input-container {
        padding-bottom: calc(15px + env(safe-area-inset-bottom));
      }
    }
    
    /* Prevent zoom on input focus */
    input, textarea {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
</body>
</html>
